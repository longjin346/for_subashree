<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2245c7">
  <meta name="description" content="A playful five-question workplace well-being tarot quiz.">
  <title>Your well-being tarot card</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap');
    :root{--blue:#2146c7;--navy:#13265a;--pink:#f5a3b4;--paper:#fff9e9;--yellow:#ffd43d;--mint:#82d7b5;--purple:#7651bc;--ink:#152454}
    *{box-sizing:border-box}
    html{background:var(--pink)}
    body{margin:0;min-height:100svh;color:var(--ink);font-family:"DM Sans",sans-serif;background:radial-gradient(circle at 15% 12%,rgba(255,255,255,.28),transparent 24%),radial-gradient(circle at 85% 88%,rgba(255,212,61,.22),transparent 28%),var(--pink);overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E")}
    button{font:inherit;-webkit-tap-highlight-color:transparent}
    .shell{min-height:100svh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:1040px;margin:auto;padding:max(clamp(20px,4vw,44px),env(safe-area-inset-top)) max(clamp(20px,4vw,44px),env(safe-area-inset-right)) max(clamp(20px,4vw,44px),env(safe-area-inset-bottom)) max(clamp(20px,4vw,44px),env(safe-area-inset-left))}
    .topbar{display:flex;align-items:center;gap:18px}
    .brand{font-family:"Fraunces",serif;font-size:clamp(1rem,2vw,1.25rem);white-space:nowrap}
    .progress{height:10px;flex:1;border:2px solid var(--ink);border-radius:99px;background:rgba(255,249,233,.55);overflow:hidden;box-shadow:2px 2px 0 var(--ink)}
    .progress span{display:block;height:100%;width:20%;background:var(--yellow);transition:width .35s ease}
    .count{font-weight:700;min-width:52px;text-align:right}
    .stage{display:grid;place-items:center;padding:36px 0}
    .question{width:min(100%,780px);animation:enter .45s cubic-bezier(.2,.8,.2,1)}
    @keyframes enter{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:7px 13px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
    h1{font:700 clamp(2.2rem,6vw,4.7rem)/.98 "Fraunces",serif;letter-spacing:-.035em;margin:22px 0 30px;max-width:850px}
    .answers{display:grid;gap:12px}
    .answer{width:100%;min-height:58px;text-align:left;border:2px solid var(--ink);border-radius:15px;background:var(--paper);color:var(--ink);padding:16px 18px;display:flex;align-items:center;gap:15px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .16s,box-shadow .16s,background .16s}
    .answer:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
    .answer:focus-visible,.nav:focus-visible{outline:4px solid white;outline-offset:3px}
    .answer.selected{background:var(--yellow);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
    .key{display:grid;place-items:center;flex:0 0 34px;height:34px;border:2px solid var(--ink);border-radius:9px;background:white;font-weight:700}
    .answer-copy{font-size:clamp(1rem,2vw,1.15rem);line-height:1.35}
    .footer{display:flex;justify-content:space-between;align-items:center;gap:14px}
    .hint{font-size:.9rem;font-weight:600;opacity:.75}
    .controls{display:flex;gap:10px;margin-left:auto}
    .nav{min-height:44px;border:2px solid var(--ink);border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink);background:var(--paper);color:var(--ink)}
    .nav.primary{background:var(--blue);color:white}
    .nav:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:translate(2px,2px)}
    .result{width:min(100%,900px);display:grid;grid-template-columns:minmax(240px,390px) 1fr;gap:clamp(28px,6vw,70px);align-items:center;animation:reveal .8s cubic-bezier(.2,.85,.2,1)}
    @keyframes reveal{from{opacity:0;transform:scale(.92) rotate(-1deg)}to{opacity:1;transform:none}}
    .card-wrap{position:relative;filter:drop-shadow(12px 14px 0 rgba(19,38,90,.25))}
    .card-wrap:before{content:"✦";position:absolute;z-index:2;top:-24px;right:-25px;font-size:58px;color:var(--yellow);text-shadow:2px 2px 0 var(--ink);animation:spin 4s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .card{display:block;width:100%;border:3px solid var(--ink);border-radius:24px}
    .result-copy h1{margin:12px 0 18px}
    .result-copy p{font-size:clamp(1.05rem,2.4vw,1.35rem);line-height:1.55;margin:0 0 24px}
    .wish{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:18px;box-shadow:5px 5px 0 var(--ink)}
    .confetti{position:fixed;top:-30px;width:12px;height:22px;z-index:10;pointer-events:none;animation:fall var(--d) linear var(--delay) forwards;transform:rotate(var(--r));background:var(--c)}
    @keyframes fall{to{transform:translate3d(var(--x),110svh,0) rotate(760deg)}}
    @media(max-width:700px){.shell{padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.stage{padding:28px 0}.brand{display:none}.progress{height:9px}h1{font-size:clamp(2rem,10vw,3.3rem)}.result{grid-template-columns:1fr;max-width:430px;padding-top:12px}.card-wrap{width:min(76vw,330px);margin:auto}.result-copy{text-align:center}.footer{align-items:flex-end}.hint{display:none}.nav{padding:11px 16px}.answer{padding:14px}.result-copy h1{font-size:2.7rem}}
    @media(max-width:420px){.topbar{gap:10px}.count{min-width:44px;font-size:.88rem}.stage{padding:22px 0}.eyebrow{font-size:.84rem;padding:6px 10px}h1{font-size:clamp(1.85rem,9.7vw,2.45rem);margin:17px 0 23px}.answers{gap:10px}.answer{align-items:flex-start;gap:11px;padding:13px;min-height:62px}.key{flex-basis:32px;height:32px}.answer-copy{font-size:1rem;line-height:1.32}.controls{width:100%;justify-content:space-between}.nav{min-width:calc(50% - 5px);padding:11px 12px}.card-wrap{width:min(82vw,310px)}.result-copy h1{font-size:clamp(2.2rem,11vw,2.7rem)}}
    @media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}.confetti{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar" aria-label="Quiz progress"><div class="brand">Well-being tarot</div><div class="progress" aria-hidden="true"><span id="progress"></span></div><div class="count" id="count">1 / 5</div></header>
    <section class="stage" id="stage" aria-live="polite"></section>
    <footer class="footer" id="footer"><div class="hint">Press 1–4 to choose · Enter to continue</div><div class="controls"><button class="nav" id="back" type="button">Back</button><button class="nav primary" id="next" type="button" disabled>Next</button></div></footer>
  </main>
  <script>
    const questions=[
      {tag:"A tiny pocket of freedom",q:"Your calendar suddenly has a free 30 minutes. You…",a:["Stare out the window and become emotionally attached to a cloud","Make a glorious little to-do list and tick off one thing immediately","Find a snack, a plant, or a friendly human","Tell yourself, ‘I can do this,’ then do the mildly scary thing"],cards:["star","chariot","empress","strength"]},
      {tag:"Plot twist",q:"A surprise challenge lands in your lap. Your energy is…",a:["Okay. Deep breath. We are brave and we are hydrated.","Who needs support? Also, does anyone need a biscuit?","Right. What’s the goal, and what’s step one?","There must be a lesson here… preferably one with a happy ending."],cards:["strength","empress","chariot","star"]},
      {tag:"Team magic",q:"Your ideal team superpower would be…",a:["Making everyone feel welcome, seen, and fed","Finding the silver lining without becoming annoying about it","Being quietly unstoppable when things get tricky","Turning messy ideas into an actual plan"],cards:["empress","star","strength","chariot"]},
      {tag:"The small win",q:"You’ve finished a long day. What feels most rewarding?",a:["Seeing one important thing finally move forward","Staying kind, even when the day had opinions","Feeling a little more like yourself again","Laughing with someone you enjoy being around"],cards:["chariot","strength","star","empress"]},
      {tag:"Final vibe check",q:"Pick a mini mantra for this week:",a:["A fresh start can begin with one tiny hopeful thought.","I deserve good things, including a proper lunch break.","One step at a time still counts as forward.","I have more courage than my brain’s dramatic trailer suggests."],cards:["star","empress","chariot","strength"]}
    ];
    const results={
      star:{title:"The Star",type:"The hopeful human",image:"assets/the-star.png",wish:"May you have renewed energy, lighter days, and delightful signs that things are going to be okay. Keep shining—at a sensible brightness."},
      strength:{title:"Strength",type:"The quiet powerhouse",image:"assets/strength.png",wish:"May you trust your resilience, protect your peace, and remember that gentle can also be mighty. You do not need to roar every day."},
      empress:{title:"The Empress",type:"The good-vibes gardener",image:"assets/the-empress.png",wish:"May you be surrounded by care, creativity, and people who make your world feel more abundant. May your coffee be warm and your meetings be short."},
      chariot:{title:"The Chariot",type:"The focused force",image:"assets/the-chariot.png",wish:"May you move forward with clarity, confidence, and enough momentum to get things done without sprinting into burnout."}
    };
    let step=0;const answers=Array(questions.length).fill(null);
    const stage=document.getElementById('stage'),back=document.getElementById('back'),next=document.getElementById('next'),progress=document.getElementById('progress'),count=document.getElementById('count'),footer=document.getElementById('footer');
    function render(){const item=questions[step];count.textContent=`${step+1} / ${questions.length}`;progress.style.width=`${((step+1)/questions.length)*100}%`;back.disabled=step===0;next.disabled=answers[step]===null;next.textContent=step===questions.length-1?'Reveal my card':'Next';stage.innerHTML=`<div class="question" key="${step}"><div class="eyebrow">✦ ${item.tag}</div><h1>${item.q}</h1><div class="answers" role="radiogroup" aria-label="Answer choices">${item.a.map((text,i)=>`<button class="answer ${answers[step]===i?'selected':''}" type="button" role="radio" aria-checked="${answers[step]===i}" data-i="${i}"><span class="key">${i+1}</span><span class="answer-copy">${text}</span></button>`).join('')}</div></div>`;stage.querySelectorAll('.answer').forEach(btn=>btn.onclick=()=>select(Number(btn.dataset.i)))}
    function select(i){answers[step]=i;render();stage.querySelector(`[data-i="${i}"]`).focus()}
    function winner(){const score={star:0,strength:0,empress:0,chariot:0};answers.forEach((answer,i)=>score[questions[i].cards[answer]]++);const max=Math.max(...Object.values(score));const tied=Object.keys(score).filter(k=>score[k]===max);if(tied.length===1)return tied[0];const finalChoice=questions[4].cards[answers[4]];return tied.includes(finalChoice)?finalChoice:tied[0]}
    function celebrate(){const colors=['#2146c7','#ffd43d','#7651bc','#82d7b5','#f15b7b','#fff9e9'];for(let i=0;i<85;i++){const bit=document.createElement('i');bit.className='confetti';bit.style.left=Math.random()*100+'vw';bit.style.setProperty('--x',(Math.random()*180-90)+'px');bit.style.setProperty('--d',(2.2+Math.random()*2.2)+'s');bit.style.setProperty('--delay',(Math.random()*.65)+'s');bit.style.setProperty('--r',(Math.random()*180)+'deg');bit.style.setProperty('--c',colors[i%colors.length]);document.body.appendChild(bit);setTimeout(()=>bit.remove(),5000)}}
    function showResult(){const key=winner(),r=results[key];document.querySelector('.topbar').style.visibility='hidden';footer.innerHTML='<div></div><div class="controls"><button class="nav" id="restart" type="button">Take it again</button></div>';stage.innerHTML=`<div class="result"><div class="card-wrap"><img class="card" src="${r.image}" alt="${r.title} tarot card illustration"></div><div class="result-copy"><div class="eyebrow">Your card has arrived ✦</div><h1>${r.type}</h1><p>You drew <strong>${r.title}</strong>.</p><div class="wish">${r.wish}</div></div></div>`;document.getElementById('restart').onclick=()=>location.reload();celebrate()}
    next.onclick=()=>{if(answers[step]===null)return;if(step<questions.length-1){step++;render()}else showResult()};back.onclick=()=>{if(step>0){step--;render()}};
    document.addEventListener('keydown',e=>{if(document.querySelector('.result'))return;if(['1','2','3','4'].includes(e.key))select(Number(e.key)-1);if(e.key==='Enter'&&!next.disabled)next.click();if(e.key==='ArrowLeft'&&step>0)back.click()});
    render();
  </script>
</body>
</html>
