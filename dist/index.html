<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2245c7">
  <meta name="description" content="A short personality quiz.">
  <title>Quiz</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/theme.css">
  <script src="quiz.config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar" id="topbar" aria-label="Quiz progress">
      <div class="brand" id="brand"></div>
      <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1" id="progress-track">
        <span id="progress"></span>
      </div>
      <div class="count" id="count"></div>
    </header>
    <section class="stage" id="stage" aria-live="polite"></section>
    <footer class="footer" id="footer">
      <div class="hint" id="hint"></div>
      <div class="controls">
        <button class="nav" id="back" type="button"></button>
        <button class="nav primary" id="next" type="button" disabled></button>
      </div>
    </footer>
  </main>
</body>
</html>
